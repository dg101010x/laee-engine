[project]
name = "laee"
version = "0.1.0"
description = "Local Adaptive Elasticity Engine (private)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
geo = ["h3>=4"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
